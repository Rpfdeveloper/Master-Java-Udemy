name: Java examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Java exercises
        run: javac -encoding UTF-8 -d build/classes src/*.java
      - name: Test calculator CLI
        run: python -m unittest discover -s tests -v
